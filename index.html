<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUURO — Your Visual Capital</title>
<meta name="description" content="MUURO — Berlin-based studio of limited art prints and frames. The final accent your interior is missing.">
<link rel="canonical" href="https://muuro.co/">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="MUURO — Your Visual Capital">
<meta property="og:description" content="The final accent your interior is missing. Limited drops. Worldwide shipping.">
<meta property="og:url" content="https://muuro.co/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MUURO">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="MUURO — Your Visual Capital">
<meta name="twitter:description" content="The final accent your interior is missing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --ivory: #ebe3d5;
    --stone: #a8a09a;
    --stone-dim: rgba(168, 160, 154, 0.55);
    --stone-faint: rgba(168, 160, 154, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--ivory);
    font-family: 'Inter', 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 1100px 700px at 50% -10%, rgba(168, 160, 154, 0.05), transparent 60%),
      var(--bg);
    position: relative;
  }

  /* Quiet film grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
    opacity: 0.05;
    mix-blend-mode: overlay;
  }

  .frame {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 40px 56px;
  }

  .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--stone-dim);
  }

  .top,
  .bottom {
    display: flex;
    align-items: center;
    opacity: 0;
  }

  .top { justify-content: space-between; animation: fadeIn 1.2s ease 0.2s forwards; }
  .bottom { justify-content: center; animation: fadeIn 1.2s ease 1.8s forwards; }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .wordmark {
    font-size: clamp(56px, 11vw, 128px);
    font-weight: 600;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    color: var(--ivory);
    line-height: 1;
    opacity: 0;
    animation: rise 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  .rule {
    width: 56px;
    height: 1px;
    background: var(--stone-faint);
    margin: 36px 0 28px;
    transform: scaleX(0);
    transform-origin: center;
    animation: extend 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
  }

  .tagline {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--stone);
    opacity: 0;
    animation: fadeIn 1.2s ease 1.2s forwards;
  }

  .notice {
    margin-top: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    animation: fadeIn 1.2s ease 1.5s forwards;
  }

  .notice-text {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    text-transform: uppercase;
    color: var(--stone-dim);
  }

  .notice-link {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    text-transform: uppercase;
    color: var(--ivory);
    text-decoration: none;
    padding: 13px 22px 13px 26px;
    border: 1px solid var(--stone-faint);
    border-radius: 999px;
    transition: border-color 0.3s ease, background-color 0.3s ease;
  }

  .notice-link:hover,
  .notice-link:focus-visible {
    border-color: var(--stone-dim);
    background-color: rgba(168, 160, 154, 0.05);
    outline: none;
  }

  .notice-arrow {
    display: inline-block;
    font-size: 13px;
    line-height: 1;
    transition: transform 0.3s ease;
  }

  .notice-link:hover .notice-arrow,
  .notice-link:focus-visible .notice-arrow {
    transform: translate(2px, -2px);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes extend {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  @media (max-width: 600px) {
    .frame { padding: 28px 24px; }
    .wordmark { letter-spacing: 0.14em; text-indent: 0.14em; }
    .tagline { font-size: 10px; letter-spacing: 0.36em; text-indent: 0.36em; }
    .label { font-size: 10px; letter-spacing: 0.2em; }
    .rule { margin: 26px 0 22px; width: 44px; }
    .notice { margin-top: 56px; gap: 14px; }
    .notice-text { font-size: 9px; letter-spacing: 0.26em; text-indent: 0.26em; }
    .notice-link { font-size: 11px; padding: 12px 18px 12px 22px; letter-spacing: 0.18em; text-indent: 0.18em; gap: 10px; }
    .notice-arrow { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .top, .bottom, .wordmark, .rule, .tagline, .notice {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body>

<div class="frame">
  <header class="top">
    <span class="label">Berlin · DE</span>
    <span class="label">Est. 2025</span>
  </header>

  <main class="stage">
    <h1 class="wordmark">MUURO</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">Your Visual Capital</p>

    <div class="notice">
      <p class="notice-text">Site in development — orders via Instagram</p>
      <a
        class="notice-link"
        href="https://www.instagram.com/muuro.co/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Order via Instagram @muuro.co, opens in new tab"
      >
        <span>@muuro.co</span>
        <span class="notice-arrow" aria-hidden="true">&#8599;</span>
      </a>
    </div>
  </main>

  <footer class="bottom">
    <span class="label">muuro.co</span>
  </footer>
</div>

</body>
</html>
